<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カウントダウンタイマー</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: sans-serif;
        background: linear-gradient(135deg, #bfe0ff 0%, #e6f4ff 100%);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      #card {
        background: #f7fbff;
        border: 2px solid #90caf9;
        border-radius: 14px;
        padding: 24px;
        width: 100%;
        max-width: 320px;
        box-shadow: 0 6px 20px rgba(66, 133, 244, 0.25);
        text-align: center;
      }

      h1 {
        font-size: 16px;
        color: #1a5276;
        margin: 0 0 16px;
      }

      /* --- 設定エリア --- */
      #settings {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .settingBox {
        flex: 1;
        text-align: left;
      }
      .settingBox label {
        display: block;
        font-size: 11px;
        color: #666;
        margin-bottom: 4px;
      }
      .settingBox input {
        width: 100%;
        padding: 10px 6px;
        font-size: 24px;
        font-weight: bold;
        color: #1a3d5c;
        border: 2px solid #90caf9;
        border-radius: 6px;
        text-align: center;
        background: white;
      }
      .settingBox input:disabled {
        background-color: #e8eef2;
        color: #9aa9b3;
        border-color: #c3d9e8;
      }

      /* --- 音量調節 --- */
      #volumeRow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        text-align: left;
      }
      #volumeRow label {
        font-size: 13px;
        color: #666;
        white-space: nowrap;
      }
      #volumeSlider {
        flex: 1;
        accent-color: #4285f4;
      }
      #volumeValue {
        font-size: 12px;
        color: #666;
        width: 32px;
        text-align: right;
      }

      /* タイマーの数字部分 */
      #display { font-size: 32px; font-weight: bold; margin: 12px 0 20px; color: #333; border: 2px solid #90caf9; border-radius: 10px; padding: 20px; background: white; }

      /* 数字表示＋全画面ボタンをまとめる枠 */
      #displayWrap { position: relative; }
      #numberBox { position: relative; }
      /* 全画面中はボタンの基準を画面全体(#displayWrap)に切り替える */
      #displayWrap.fsActive #numberBox {
        position: static;
      }

      /* 全画面切り替えボタン（数字の右上に重ねて表示） */
      #fullscreenBtn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 30px;
        height: 30px;
        padding: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.75);
        color: #1a5276;
        border: 1px solid #90caf9;
        border-radius: 6px;
      }
      #fullscreenBtn svg { display: block; }
      #fullscreenBtn:active { background: rgba(255, 255, 255, 0.95); }

      /* --- 全画面表示中のスタイル（YouTube風にカウントダウン部分だけを画面いっぱいに） ---
         ブラウザ標準のFullscreen APIはiPhone(WebKit)では動作しないことがあるため、
         実際の全画面遷移が成功したかどうかに関わらず、position:fixedで画面全体を
         覆う「疑似全画面」をCSSだけで実現し、.fsActiveクラスで一括制御する。 */
      #displayWrap.fsActive {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        max-width: none;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1b2a;
        margin: 0;
        z-index: 999999;
      }
      #displayWrap.fsActive #display {
        font-size: 20vw;
        border: none;
        background: transparent;
        color: #eaf4ff;
        margin: 0;
        padding: 0;
      }
      #displayWrap.fsActive #fullscreenBtn {
        top: 24px;
        right: 24px;
        background: rgba(255, 255, 255, 0.15);
        color: #eaf4ff;
        border-color: rgba(255, 255, 255, 0.4);
      }

      /* 全画面中：サイクル数バッジを画面上部に固定 */
      #displayWrap.fsActive #cycleCount {
        position: absolute;
        top: 32px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
      }

      /* 全画面中：ステータス表示＋操作ボタンを画面下部に固定（普段は隠す） */
      #fsFooter { display: contents; }
      #displayWrap.fsActive #fsFooter {
        display: block;
        position: absolute;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 320px;
        padding: 0 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      /* カーソルを下部に移動 / スマホでタップした時だけ表示 */
      #displayWrap.fsActive.showFooter #fsFooter {
        opacity: 1;
        pointer-events: auto;
      }
      #displayWrap.fsActive #status {
        color: #ff8a80;
      }

      /* ボタン全般のスタイル */
      button { padding: 12px; font-size: 16px; cursor: pointer; width: 100%; border-radius: 5px; border: none; color: white; font-weight: bold; margin-bottom: 5px; }

      /* 開始・再開系（青） */
      .btn-blue { background-color: #4285f4; }
      .btn-blue:active { background-color: #357ae8; }

      /* 停止・リセット系（赤） */
      .btn-red { background-color: #ea4335; }
      .btn-red:active { background-color: #c5221f; }

      /* 一時停止系（黄） */
      .btn-yellow { background-color: #fbbc05; color: #333; }
      .btn-yellow:active { background-color: #e0a800; }

      /* 一時停止ボタン専用（最初は非表示） */
      #pauseBtn { display: none; }

      /* 音テストボタン（少し小さく目立たない色に） */
      #testBtn { background-color: #6c757d; font-size: 11px; padding: 5px; opacity: 0.8; }

      /* 状態表示テキスト（計測中・インターバルなど） */
      #status { color: #d32f2f; margin-top: 15px; font-size: 13px; min-height: 1.5em; font-weight: bold; }

      /* サイクル数表示（バッジ風に大きく強調） */
      #cycleCount {
        display: inline-block;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background-color: #4285f4;
        border-radius: 20px;
        padding: 6px 16px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <h1>カウントダウンタイマー</h1>

      <div id="settings">
        <div class="settingBox">
          <label for="workMin">作業(分)</label>
          <input type="number" id="workMin" min="0.1" step="0.1" value="25">
        </div>
        <div class="settingBox">
          <label for="breakMin">休憩(分)</label>
          <input type="number" id="breakMin" min="0.1" step="0.1" value="5">
        </div>
      </div>

      <div id="volumeRow">
        <label for="volumeSlider">🔊 音量</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="onVolumeChange()">
        <span id="volumeValue">50%</span>
      </div>

      <div id="displayWrap">
        <div id="cycleCount">準備完了</div>
        <div id="numberBox">
          <div id="display">00:00</div>
          <button id="fullscreenBtn" type="button" onclick="toggleFullscreen()" title="全画面表示">
            <svg id="fsIconExpand" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
            <svg id="fsIconCompress" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
          </button>
        </div>
        <div id="fsFooter">
          <div id="status"></div>
          <button id="mainBtn" class="btn-blue" onclick="toggleTimer()">スタート</button>
          <button id="pauseBtn" class="btn-yellow" onclick="togglePause()">一時停止</button>
        </div>
      </div>
      <button id="testBtn" onclick="playBeep(2)">音テスト</button>
    </div>

<script>
  /* --- 状態を管理する変数（グローバル変数） --- */
  let timerId = null;      // カウントダウン（setInterval）を止めるためのID
  let isRunning = false;   // タイマーが動いているかどうかのフラグ
  let isPaused = false;    // 一時停止中かどうかのフラグ
  let audioCtx = null;     // Web Audio API（音を鳴らす仕組み）の管理
  let currentCycle = 1;    // 現在何セット目か
  const MAX_CYCLES = 100;   // 最大何セットまで繰り返すか

  // 一時停止から再開するために現在の残り時間と処理を保存する変数
  let remainingSeconds = 0;
  let onCompleteCallback = null;

  const STORAGE_KEY_WORK = 'pomodoroWorkMin';
  const STORAGE_KEY_BREAK = 'pomodoroBreakMin';
  const STORAGE_KEY_VOLUME = 'pomodoroVolume';
  const MAX_GAIN = 0.3; // スライダー100%時の最大音量（元の固定値0.15はスライダー50%相当）

  // ページを開いた時に前回の設定値を復元（スプレッドシートB2/C2の代わり）
  window.addEventListener('DOMContentLoaded', () => {
    try {
      const savedWork = localStorage.getItem(STORAGE_KEY_WORK);
      const savedBreak = localStorage.getItem(STORAGE_KEY_BREAK);
      const savedVolume = localStorage.getItem(STORAGE_KEY_VOLUME);
      if (savedWork) document.getElementById('workMin').value = savedWork;
      if (savedBreak) document.getElementById('breakMin').value = savedBreak;
      if (savedVolume !== null) document.getElementById('volumeSlider').value = savedVolume;
    } catch (e) { /* localStorageが使えない環境でも動作は継続 */ }
    document.getElementById('volumeValue').innerText = document.getElementById('volumeSlider').value + '%';
  });

  /**
   * 音量スライダーが動かされた時の処理
   */
  function onVolumeChange() {
    const slider = document.getElementById('volumeSlider');
    document.getElementById('volumeValue').innerText = slider.value + '%';
    try {
      localStorage.setItem(STORAGE_KEY_VOLUME, slider.value);
    } catch (e) { /* 保存できなくても動作は継続 */ }
  }

  /**
   * スライダーの値(0-100)を実際のgain値に変換
   */
  function getVolumeGain() {
    const slider = document.getElementById('volumeSlider');
    return (parseFloat(slider.value) / 100) * MAX_GAIN;
  }

  /**
   * GASのgetSettings()の代わり。ページ内の入力欄から直接値を取る。
   */
  function getSettings() {
    const workMin = parseFloat(document.getElementById('workMin').value);
    const breakMin = parseFloat(document.getElementById('breakMin').value);
    return { workMin, breakMin };
  }

  /**
   * 電子音（ピ・ピ・ピ）を鳴らす関数
   */
  function playBeep(durationSeconds) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.type = 'square';
    oscillator.frequency.value = 1760;

    const now = audioCtx.currentTime;
    gainNode.gain.setValueAtTime(0, now);

    const pipDuration = 0.07;
    const pipGap = 0.05;
    const volume = getVolumeGain();

    for (let i = 0; i < durationSeconds; i++) {
      const cycleStart = now + i;
      gainNode.gain.setValueAtTime(volume, cycleStart);
      gainNode.gain.setValueAtTime(0, cycleStart + pipDuration);

      const secondPip = cycleStart + pipDuration + pipGap;
      gainNode.gain.setValueAtTime(volume, secondPip);
      gainNode.gain.setValueAtTime(0, secondPip + pipDuration);

      const thirdPip = secondPip + pipDuration + pipGap;
      gainNode.gain.setValueAtTime(volume, thirdPip);
      gainNode.gain.setValueAtTime(0, thirdPip + pipDuration);
    }
    oscillator.start(now);
    oscillator.stop(now + durationSeconds);
  }

  /**
   * スタート/停止ボタンが押された時の振分け
   */
  function toggleTimer() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (isRunning) {
      stopTimer(); // 動いていれば停止（リセット）
    } else {
      currentCycle = 1;
      startTimer(); // 止まっていれば開始
    }
  }

  /**
   * 一時停止/再開を切り替える関数
   */
  function togglePause() {
    if (!isRunning) return; // 動いていない時は何もしない

    const pauseBtn = document.getElementById('pauseBtn');

    if (!isPaused) {
      // 一時停止する処理
      clearInterval(timerId); // カウントダウンを止める
      isPaused = true;
      pauseBtn.innerText = '再開';
      pauseBtn.classList.replace('btn-yellow', 'btn-blue');
      document.getElementById('status').innerText = '【一時停止中】';
    } else {
      // 再開する処理
      isPaused = false;
      pauseBtn.innerText = '一時停止';
      pauseBtn.classList.replace('btn-blue', 'btn-yellow');
      // 保存しておいた残り時間と後続処理でカウントダウンを再開
      runSequence(remainingSeconds, onCompleteCallback);
    }
  }

  /**
   * タイマーの開始処理
   */
  function startTimer() {
    const statusEl = document.getElementById('status');
    const cycleEl = document.getElementById('cycleCount');
    const pauseBtn = document.getElementById('pauseBtn');
    const workInput = document.getElementById('workMin');
    const breakInput = document.getElementById('breakMin');

    const settings = getSettings();
    let workMin = settings.workMin;
    let breakMin = settings.breakMin;

    if (isNaN(workMin) || isNaN(breakMin) || workMin <= 0 || breakMin <= 0) {
      statusEl.innerText = '設定値（作業時間・休憩時間）が正しくありません';
      return;
    }

    // 次回開いた時のために設定値を保存
    try {
      localStorage.setItem(STORAGE_KEY_WORK, workMin);
      localStorage.setItem(STORAGE_KEY_BREAK, breakMin);
    } catch (e) { /* 保存できなくても動作は継続 */ }

    isRunning = true;
    isPaused = false;
    const mainBtn = document.getElementById('mainBtn');
    mainBtn.innerText = '停止・リセット';
    mainBtn.classList.replace('btn-blue', 'btn-red');
    pauseBtn.style.display = 'block'; // 一時停止ボタンを表示
    workInput.disabled = true;  // 計測中は設定変更不可に
    breakInput.disabled = true;

    function loop() {
      if (!isRunning || currentCycle > MAX_CYCLES) {
        if (currentCycle > MAX_CYCLES) statusEl.innerText = '最大回数に達しました';
        return;
      }

      cycleEl.innerText = 'サイクル: ' + currentCycle + ' / ' + MAX_CYCLES;

      // --- ステップ1: 集中時間の計測 ---
      statusEl.innerText = '【計測中...】';
      runSequence(workMin * 60, () => {
        if (!isRunning) return;
        playBeep(3);

        // --- ステップ2: 休憩時間の計測 ---
        statusEl.innerText = '【インターバル】';
        runSequence(breakMin * 60, () => {
          if (!isRunning) return;
          playBeep(3);
          currentCycle++;
          loop();
        });
      });
    }
    loop();
  }

  /**
   * カウントダウン処理（一時停止のために引数を保存するように変更）
   */
  function runSequence(totalSec, onComplete) {
    remainingSeconds = totalSec;   // 現在の残り秒数を保存
    onCompleteCallback = onComplete; // 終了時の処理を保存

    updateDisplay(remainingSeconds);

    if (timerId) clearInterval(timerId);

    timerId = setInterval(() => {
      if (isPaused) return; // 一時停止中なら数字を減らさない

      remainingSeconds--;
      if (remainingSeconds < 0) {
        clearInterval(timerId);
        onComplete();
        return;
      }
      updateDisplay(remainingSeconds);
    }, 1000);
  }

  /**
   * カウントダウン部分の全画面表示を切り替える（同じボタンでON/OFF）
   *
   * ブラウザ標準のFullscreen API (requestFullscreen) は、PC/Android Chromeでは
   * 動作するが、iPhone(WebKit系ブラウザ)では未対応・失敗することがある。
   * そのため「.fsActiveクラスをつける＝全画面表示中」として扱い、
   * 可能ならFullscreen APIも併用（対応環境ではブラウザのアドレスバー等も隠せる）しつつ、
   * 失敗・非対応の場合はCSSのposition:fixedによる疑似全画面のみで見た目を実現する。
   */
  function toggleFullscreen() {
    const wrap = document.getElementById('displayWrap');
    const isActive = wrap.classList.contains('fsActive');
    if (!isActive) {
      enterFullscreen();
    } else {
      exitFullscreen();
    }
  }

  function supportsRealFullscreen() {
    const el = document.documentElement;
    const enabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    const canRequest = el.requestFullscreen || el.webkitRequestFullscreen;
    return !!(enabled && canRequest);
  }

  function enterFullscreen() {
    const wrap = document.getElementById('displayWrap');
    if (supportsRealFullscreen()) {
      try {
        const request = wrap.requestFullscreen
          ? wrap.requestFullscreen()
          : wrap.webkitRequestFullscreen();
        Promise.resolve(request)
          .then(() => setFullscreenState(true))
          .catch(() => enterPseudoFullscreen()); // 対応表明はあるが実際は失敗する環境向けフォールバック
        return;
      } catch (e) {
        // requestFullscreenが同期的に例外を投げる環境向けフォールバック
      }
    }
    enterPseudoFullscreen();
  }

  function enterPseudoFullscreen() {
    document.getElementById('displayWrap').classList.add('fsPseudo');
    document.body.style.overflow = 'hidden'; // 背景側のスクロールを止める
    setFullscreenState(true);
  }

  function exitFullscreen() {
    const wrap = document.getElementById('displayWrap');
    if (wrap.classList.contains('fsPseudo')) {
      wrap.classList.remove('fsPseudo');
      document.body.style.overflow = '';
      setFullscreenState(false);
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  }

  // ボタンの見た目・表示状態クラスをまとめて更新
  function setFullscreenState(isFullscreen) {
    const wrap = document.getElementById('displayWrap');
    wrap.classList.toggle('fsActive', isFullscreen);
    const btn = document.getElementById('fullscreenBtn');
    btn.title = isFullscreen ? '全画面解除' : '全画面表示';
    document.getElementById('fsIconExpand').hidden = isFullscreen;
    document.getElementById('fsIconCompress').hidden = !isFullscreen;
    // 全画面の出入りをまたいで下部ボタンの表示状態が残らないようにリセット
    clearTimeout(fsFooterHideTimer);
    wrap.classList.remove('showFooter');
  }

  // ブラウザ標準のFullscreen APIが実際に有効/解除された時（Escキーで解除された場合を含む）に追従
  function onFullscreenChange() {
    const isNativeFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const wrap = document.getElementById('displayWrap');
    if (!isNativeFullscreen && !wrap.classList.contains('fsPseudo')) {
      setFullscreenState(false);
    }
  }
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);

  /* --- 全画面中：カーソルが画面下部にある間／タップした直後だけ操作ボタンを表示 --- */
  let fsFooterHideTimer = null;
  const FS_BOTTOM_ZONE_RATIO = 0.82; // 画面高さの下側18%にカーソルがあれば表示対象

  function isFullscreenNow() {
    return document.getElementById('displayWrap').classList.contains('fsActive');
  }

  function showFsFooter() {
    document.getElementById('displayWrap').classList.add('showFooter');
  }

  function hideFsFooter() {
    document.getElementById('displayWrap').classList.remove('showFooter');
  }

  // マウス操作: カーソルが下部にある間だけ表示し、離れたら隠す
  document.addEventListener('mousemove', (e) => {
    if (!isFullscreenNow()) return;
    clearTimeout(fsFooterHideTimer);
    if (e.clientY >= window.innerHeight * FS_BOTTOM_ZONE_RATIO) {
      showFsFooter();
    } else {
      fsFooterHideTimer = setTimeout(hideFsFooter, 300); // 通過しただけの時のチラつき防止
    }
  });

  // タッチ操作: 一度タップしたら一時的に表示し、しばらくしたら自動で隠す
  document.addEventListener('touchstart', () => {
    if (!isFullscreenNow()) return;
    clearTimeout(fsFooterHideTimer);
    showFsFooter();
    fsFooterHideTimer = setTimeout(hideFsFooter, 3000);
  }, { passive: true });

  /**
   * 画面の「00:00」表示を更新する
   */
  function updateDisplay(seconds) {
    let m = Math.floor(seconds / 60);
    let s = seconds % 60;
    document.getElementById('display').innerText =
      ("0" + m).slice(-2) + ":" + ("0" + s).slice(-2);
  }

  /**
   * 全てをリセットして停止する
   */
  function stopTimer() {
    if (timerId) clearInterval(timerId);
    isRunning = false;
    isPaused = false;

    // ボタンの表示状態を戻す
    const mainBtn = document.getElementById('mainBtn');
    mainBtn.innerText = 'スタート';
    mainBtn.classList.replace('btn-red', 'btn-blue');
    const pauseBtn = document.getElementById('pauseBtn');
    pauseBtn.style.display = 'none';
    pauseBtn.innerText = '一時停止';
    pauseBtn.classList.remove('btn-blue');
    pauseBtn.classList.add('btn-yellow');

    document.getElementById('workMin').disabled = false;
    document.getElementById('breakMin').disabled = false;

    document.getElementById('display').innerText = '00:00';
    document.getElementById('status').innerText = 'リセットしました';
